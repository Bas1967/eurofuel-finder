name: Bouw EuroFuel Finder APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "sw.js"
      - "package.json"
      - "capacitor.config.json"
      - "build.js"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal project op
        uses: actions/checkout@v4

      - name: Installeer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installeer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installeer Android bouwpakketten
        run: npm install

      - name: Zet webbestanden klaar
        run: npm run build

      - name: Maak Android-project
        run: npx cap add android

      - name: Synchroniseer app
        run: npx cap sync android

      - name: Bouw APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Bewaar APK
        uses: actions/upload-artifact@v4
        with:
          name: EuroFuel-Finder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
